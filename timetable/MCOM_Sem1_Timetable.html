<html lang="en">
<head>
<meta charset="UTF-8">

<title>M.Com — Timetable</title>
<style>
  :root{
    --deep:#122b0a;
    --green:#1c3d12;
    --green-mid:#254b17;
    --olive:#3a4a2e;
    --paper:#ffffff;
    --ink:#1d2418;
    --muted:#6d7566;
    --line:#e4e6de;
    --card:#fbfbf8;
    --gold:#b98f3e;
    --maroon:#5c2f2a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: Georgia, 'Iowan Old Style','Palatino Linotype', 'Noto Serif', serif;
    background:var(--paper);
    color:var(--ink);
  }
  a{color:inherit;}

  /* ===== Top nav ===== */
  .topnav{
    background:var(--deep);
    color:#f2f4ee;
    padding:14px 6vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand .mark{
    width:38px;height:38px;flex:none;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d9a441, #8a5a1f 70%);
    border:2px solid #e3c688;
  }
  .brand .name{
    font-size:14.5px;
    letter-spacing:0.3px;
    line-height:1.25;
  }
  .brand .name strong{ display:block; font-size:15.5px; }
  .navlinks{
    display:flex;
    gap:26px;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:13px;
    letter-spacing:0.3px;
    opacity:0.9;
  }
  @media (max-width:760px){ .navlinks{display:none;} }

  /* ===== Hero ===== */
  .hero{
    position:relative;
    min-height:300px;
    background:
      linear-gradient(120deg, rgba(18,43,10,0.55) 0%, rgba(46,66,34,0.4) 55%, rgba(18,43,10,0.6) 100%),
      linear-gradient(135deg, #2a3d20 0%, #364a28 40%, #2a3d20 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .hero::before, .hero::after{
    content:"";
    position:absolute;
    top:-20%;
    width:60%;
    height:160%;
    background: rgba(0,0,0,0.12);
  }
  .hero::before{
    left:-10%;
    transform: skewX(-18deg);
    background: rgba(0,0,0,0.14);
  }
  .hero::after{
    right:-15%;
    transform: skewX(-18deg);
    background: rgba(255,255,255,0.03);
  }
  .hero-shapes{
    position:absolute; inset:0;
    background-image:
      linear-gradient(115deg, transparent 0%, transparent 38%, rgba(255,255,255,0.05) 38%, rgba(255,255,255,0.05) 46%, transparent 46%),
      linear-gradient(115deg, transparent 55%, rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.18) 68%, transparent 68%);
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    z-index:2;
    padding: 60px 20px;
  }
  .hero h1{
    margin:0;
    color:#fbf9f1;
    font-weight:700;
    font-size:clamp(34px,5.4vw,58px);
    letter-spacing:0.5px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.25);
  }
  .hero p{
    margin:10px 0 0;
    color:#e6e6dd;
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    opacity:0.85;
  }

  /* ===== content ===== */
  .content{
    background:var(--paper);
    padding: 40px 6vw 60px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px 28px 24px;
    box-shadow: 0 1px 2px rgba(20,30,15,0.03);
  }

  .filters{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px 16px;
    align-items:end;
  }
  @media (max-width: 700px){
    .filters{grid-template-columns: 1fr 1fr;}
  }
  .reset-wrap{
    grid-column: 1 / -1;
    display:flex;
    justify-content:center;
    margin-top:4px;
  }
  .field label{
    display:block;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:10.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  select, input[type="text"]{
    width:100%;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#ffffff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0 L5 6 L10 0" fill="none" stroke="%231c3d12" stroke-width="1.4"/></svg>') no-repeat right 12px center;
    background-size:10px 6px;
    appearance:none;
    -webkit-appearance:none;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]{ background-image:none; padding-left:34px; }
  .field.search{position:relative;}
  .field.search svg{
    position:absolute;
    left:11px; bottom:11px;
    width:15px;height:15px;
    stroke:var(--muted);
  }
  select:focus, input[type="text"]:focus{
    outline:none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(185,143,62,0.15);
  }
  .btn-reset{
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.3px;
    padding:10px 16px;
    border-radius:7px;
    border:1px solid var(--green);
    background:var(--green);
    color:#f4efe2;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-reset:hover{ background:#254b17; }
  .btn-reset:active{ transform: translateY(1px); }

  /* ===== results ===== */
  .results{ margin-top:28px; }
  .results-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .results-head h2{
    margin:0;
    font-size:14px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--green);
    font-weight:700;
  }
  .count{
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:12.5px;
    color:var(--muted);
  }

  .day-group{ margin-bottom:26px; }
  .day-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin: 0 0 10px;
  }
  .day-title .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
  }
  .day-title h3{
    margin:0;
    font-size:18px;
    color:var(--green);
    font-weight:700;
    letter-spacing:0.3px;
  }
  .day-title .rule{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:10.5px;
    letter-spacing:1.1px;
    text-transform:uppercase;
    color:var(--muted);
    background:#f4f5ef;
    padding:11px 16px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:13px 16px;
    font-size:14.5px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f7f8f2;}
  .t-time{
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-weight:600;
    color:var(--green);
    white-space:nowrap;
  }
  .t-subject .code{
    display:inline-block;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.4px;
    color:var(--green);
    background:rgba(28,61,18,0.08);
    padding:2px 7px;
    border-radius:4px;
    margin-right:8px;
  }
  .t-subject .name{ color:var(--ink); }
  .t-teacher{ color:var(--ink); }
  .t-section{
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:12.5px;
    color:var(--maroon);
    background:rgba(92,47,42,0.08);
    padding:3px 9px;
    border-radius:12px;
    display:inline-block;
    white-space:nowrap;
  }
  .t-hall{ color:var(--muted); font-size:13.5px; }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:14px;
    background:#fff;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  /* ===== footer ===== */
  footer.site-footer{
    background:var(--green);
    color:#eef1e6;
    padding:44px 6vw 34px;
  }
  .footer-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:32px;
    max-width:1100px;

  .footer-grid h4{

    font-size:24px;
    font-weight:700;
    color:#fbf9f1;
  }
  .footer-grid ul{
    list-style:none;
    margin:0; padding:0;
    display:flex; flex-direction:column; gap:9px;
  }
  .footer-grid a{
    text-decoration:none;
    font-size:14.5px;
    color:#dfe6d5;
  }
  .footer-grid a:hover{ color:#fff; text-decoration:underline; }
  .footer-bottom{
    margin-top:36px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size:12px;
    color:#c3ccb5;
  }
</style>
</head>

const dayOrder = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function timeToMinutes(t){
  const start = t.split('-')[0].trim();
  const [h,m] = start.split(':').map(Number);
  return h*60+m;
}

function uniqueSorted(arr){
  return Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b));
}

function populateSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  });
}

const days = dayOrder.filter(d => DATA.some(r=>r.day===d));
populateSelect('fDay', days);

const sections = uniqueSorted(DATA.map(r=>r.section));
populateSelect('fSection', sections);

const subjects = uniqueSorted(DATA.map(r=>r.subject));
populateSelect('fSubject', subjects);

const fDay = document.getElementById('fDay');
const fSemester = document.getElementById('fSemester');
const fSection = document.getElementById('fSection');
const fSubject = document.getElementById('fSubject');
const fTeacher = document.getElementById('fTeacher');
const resetBtn = document.getElementById('resetBtn');
const resultsContainer = document.getElementById('resultsContainer');
const resultCount = document.getElementById('resultCount');

function splitSubject(s){
  const idx = s.indexOf(':');
  if(idx === -1) return {code:'', name:s};
  return {code:s.slice(0,idx).trim(), name:s.slice(idx+1).trim()};
}

function render(){
  if(fSemester.value !== 'I'){
    resultCount.textContent = '';
    resultsContainer.innerHTML = `<div class="empty">Timetable for Semester ${fSemester.value} has not been published yet. Please check back later.</div>`;
    return;
  }

  const dayVal = fDay.value;
  const sectionVal = fSection.value;
  const subjectVal = fSubject.value;
  const teacherVal = fTeacher.value.trim().toLowerCase();

  let filtered = DATA.filter(r=>{
    if(dayVal && r.day !== dayVal) return false;
    if(sectionVal && r.section !== sectionVal) return false;
    if(subjectVal && r.subject !== subjectVal) return false;
    if(teacherVal && !r.teacher.toLowerCase().includes(teacherVal)) return false;
    return true;
  });

  resultCount.textContent = filtered.length + (filtered.length===1 ? ' class found' : ' classes found');

  resultsContainer.innerHTML = '';

  if(filtered.length === 0){
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = 'No classes match these filters. Try adjusting your search.';
    resultsContainer.appendChild(div);
    return;
  }

  const grouped = {};
  filtered.forEach(r=>{
    if(!grouped[r.day]) grouped[r.day] = [];
    grouped[r.day].push(r);
  });

  const orderedDays = dayOrder.filter(d => grouped[d]);

  orderedDays.forEach(day=>{
    const rows = grouped[day].slice().sort((a,b)=> timeToMinutes(a.timing) - timeToMinutes(b.timing));

    const groupDiv = document.createElement('div');
    groupDiv.className = 'day-group';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'day-title';
    titleDiv.innerHTML = `<span class="dot"></span><h3>${day}</h3><span class="rule"></span>`;
    groupDiv.appendChild(titleDiv);

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr>
          <th style="width:14%">Time</th>
          <th style="width:38%">Subject</th>
          <th style="width:20%">Teacher</th>
          <th style="width:16%">Section</th>
          <th style="width:12%">Hall</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    rows.forEach(r=>{
      const {code, name} = splitSubject(r.subject);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="t-time">${r.timing}</td>
        <td class="t-subject">${code ? `<span class="code">${code}</span>`:''}<span class="name">${name}</span></td>
        <td class="t-teacher">${r.teacher}</td>
        <td><span class="t-section">${r.section}</span></td>
        <td class="t-hall">${r.hall}</td>
      `;
      tbody.appendChild(tr);
    });

    groupDiv.appendChild(table);
    resultsContainer.appendChild(groupDiv);
  });
}

[fDay, fSemester, fSection, fSubject].forEach(el=> el.addEventListener('change', render));
fTeacher.addEventListener('input', render);

  fSemester.value = 'I';
  fSection.value = '';
  fSubject.value = '';
  fTeacher.value = '';

});

render();
</script>
